name: Update lists
on:
  schedule:
    - cron: '23 5 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: update-lists
  cancel-in-progress: false
jobs:
  update:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Update verified sources
        run: python scripts/update_lists.py --report update-report.json
      - name: Validate updated snapshot
        run: |
          python scripts/validate_lists.py
          python scripts/build_lists.py --check
          python -m unittest discover -s tests -v
      - name: Publish changes
        env:
          RULES_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git add domains subnets sources/sources.json
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore: refresh verified routing lists'
          git push origin "HEAD:$RULES_BRANCH"
      - name: Save update report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: update-report
          path: update-report.json
          if-no-files-found: ignore
